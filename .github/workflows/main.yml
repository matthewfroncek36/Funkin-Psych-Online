name: Build

on:
  push:
    branches: [ main, experimental ]
    tags: [ "*" ]
  pull_request:
    branches: [ main, experimental ]
  workflow_dispatch:

jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet

      - name: Pin compatible Haxelib versions
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install flixel 5.7.1 --quiet
          haxelib set lime 7.9.0
          haxelib set openfl 9.2.2
          haxelib set flixel 5.7.1

      - name: Install HMM dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: haxelib run lime build Project.xml linux

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: export/release/linux/bin

  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp --quiet
        shell: cmd

      - name: Pin compatible Haxelib versions
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install flixel 5.7.1 --quiet
          haxelib set lime 7.9.0
          haxelib set openfl 9.2.2
          haxelib set flixel 5.7.1
        shell: cmd

      - name: Install HMM dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install
        shell: cmd

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION
        shell: cmd

      - name: Compile
        run: haxelib run lime build windows
        shell: cmd

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildMac:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v3

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet

      - name: Pin compatible Haxelib versions
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install flixel 5.7.1 --quiet
          haxelib set lime 7.9.0
          haxelib set openfl 9.2.2
          haxelib set flixel 5.7.1

      - name: Install HMM dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile
        run: arch -x86_64 haxelib run lime build mac

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin

  release:
    if: github.ref_type == 'tag'
    needs:
      - buildLinux
      - buildMac
      - buildWindows

    runs-on: ubuntu-latest

    steps:
      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: v${{ github.ref_name }}
          draft: true
          prerelease: false

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Zip artifacts
        run: |
          zip -r windowsBuild.zip windowsBuild/
          zip -r linuxBuild.zip linuxBuild/
          zip -r macBuild.zip macBuild/

      - name: Upload Windows build
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windowsBuild.zip
          asset_name: windowsBuild.zip
          asset_content_type: application/zip

      - name: Upload Linux build
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: linuxBuild.zip
          asset_name: linuxBuild.zip
          asset_content_type: application/zip

      - name: Upload MacOS build
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: macBuild.zip
          asset_name: macBuild.zip
          asset_content_type: application/zip

      - name: Setup git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"

      # Windows publish
      - name: Checkout windows build
        uses: actions/checkout@v3
        with:
          repository: Snirozu/Funkin-Psych-Online-Builds
          ref: 'windows'
          token: ${{ secrets.BUILDS_GITHUB_TOKEN }}
          lfs: true
          path: 'builds_repo'
          sparse-checkout: |
            .gitattributes

      - name: Publish windows build
        run: |
          cd builds_repo
          git sparse-checkout disable
          cp -rf ../windowsBuild/* ./
          git add --all
          git commit -m "${{ github.run_id }}"
          git push origin windows --force

      # Linux publish
      - name: Checkout linux build
        uses: actions/checkout@v3
        with:
          repository: Snirozu/Funkin-Psych-Online-Builds
          ref: 'linux'
          token: ${{ secrets.BUILDS_GITHUB_TOKEN }}
          lfs: true
          path: 'builds_repo'
          sparse-checkout: |
            .gitattributes

      - name: Publish linux build
        run: |
          cd builds_repo
          git sparse-checkout disable
          cp -rf ../linuxBuild/* ./
          git add --all
          git commit -m "${{ github.run_id }}"
          git push origin linux --force

      # Mac publish
      - name: Checkout macos build
        uses: actions/checkout@v3
        with:
          repository: Snirozu/Funkin-Psych-Online-Builds
          ref: 'macos'
          token: ${{ secrets.BUILDS_GITHUB_TOKEN }}
          lfs: true
          path: 'builds_repo'
          sparse-checkout: |
            .gitattributes

      - name: Publish macos build
        run: |
          cd builds_repo
          git sparse-checkout disable
          cp -rf ../macBuild/* ./
          git add --all
          git commit -m "${{ github.run_id }}"
          git push origin macos --force
